services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5001/api
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - CLIENT_URL=http://localhost:5173
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
      - DATABASE_URL=postgresql://normwise:normwise_password@db:5432/normwise?schema=public
      - ML_SERVICE_URL=http://ml-service:8000
    depends_on:
      - ml-service

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - RANKER=bge-reranker-v2-m3
      - PORT=8000
