services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: normwise-postgres-dev
    environment:
      POSTGRES_DB: normwise_dev
      POSTGRES_USER: normwise
      POSTGRES_PASSWORD: normwise_dev_password
    volumes:
      - normwise_dev_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U normwise -d normwise_dev"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: normwise-backend-dev
    command: npm run dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 5001
      DATABASE_URL: postgresql://normwise:normwise_dev_password@postgres:5432/normwise_dev?schema=public
      CLIENT_URL: http://localhost:5173
      AUTH_SECRET: normwise-dev-insecure-fallback-secret-minimum-32-characters
      UPLOAD_DIR: /app/uploads
      LOG_LEVEL: debug
    volumes:
      - ./server/src:/app/src
      - ./server/prisma:/app/prisma
      - ./server/uploads:/app/uploads
    ports:
      - "5001:5001"

volumes:
  normwise_dev_pgdata:
